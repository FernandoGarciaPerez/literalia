<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/png" href="images/pluma2.png" />
		<link rel="stylesheet" href="styles.css" />
		<meta name="color-scheme" content="light" />
		<title>Poema — Literalia</title>
	</head>
	<body>
		<header class="app-header container">
			<a class="brand brand-link" href="index.html" aria-label="Ir al inicio de Literalia">
				<span class="logo" aria-hidden="true"></span>
				<div>
					<h1>Literalia</h1>
					<p class="tagline">Reflexiones</p>
				</div>
			</a>
			<nav class="site-nav" aria-label="Navegación principal">
				<a href="index.html">Inicio</a>
				<a href="contacto.html">Contacto</a>
			</nav>
		</header>

		<main class="poem-container">
			<div class="topbar">
				<a id="backBtn" class="back-btn" href="index.html" aria-label="Volver">
					← <span class="hide-sm">Volver</span>
				</a>
			</div>
			<section class="poem-body">
				<h1 class="poem-title" id="poemTitle">Cargando...</h1>
				<p class="poem-meta" id="poemMeta"></p>
				<div class="poem-actions">
					<button id="favBtn" class="btn" type="button" aria-pressed="false">♡ Favorito</button>
					<button id="copyBtn" class="btn ghost" type="button">Copiar</button>
					<button id="shareBtn" class="btn ghost" type="button">Compartir</button>
					<span id="poemStatus" class="status" role="status" aria-live="polite"></span>
				</div>
				<pre id="poemContent"></pre>
			</section>
			<div class="poem-nav">
				<button id="prevBtn" class="icon" type="button" title="Anterior" aria-label="Poema anterior">
					←
				</button>
				<button id="nextBtn" class="icon" type="button" title="Siguiente" aria-label="Poema siguiente">
					→
				</button>
			</div>
		</main>

		<footer class="container footer">
			<a href="index.html">Literalia</a>
			<span>&copy; 2026</span>
			<a href="contacto.html">Contacto</a>
		</footer>

		<script src="poema.js" type="module"></script>
	</body>
</html>
