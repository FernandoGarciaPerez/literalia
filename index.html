<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="images/pluma2.png" />
		<link rel="stylesheet" href="styles.css" />
		<meta name="color-scheme" content="light" />
		<title>Literalia</title>
	</head>
	<body>
		<header class="app-header container">
			<a class="brand brand-link" href="index.html" aria-label="Ir al inicio de Literalia">
				<span class="logo" aria-hidden="true"></span>
				<div>
					<h1>Literalia</h1>
					<p class="tagline">Reflexiones</p>
				</div>
			</a>
			<nav class="site-nav" aria-label="Navegación principal">
				<a href="index.html" aria-current="page">Inicio</a>
				<a href="contacto.html">Contacto</a>
			</nav>
		</header>

		<main class="container">
			<section class="summary-strip" aria-label="Resumen del poemario">
				<div>
					<strong id="poemCount">...</strong>
					<span>textos</span>
				</div>
				<div>
					<strong id="favoriteCountNumber">0</strong>
					<span id="favoriteCount">favoritos</span>
				</div>
			</section>

			<section class="toolbar">
				<div class="search-wrap">
					<input
						id="searchInput"
						type="search"
						placeholder="Buscar por título, autor o texto..."
						aria-label="Buscar poemas"
					/>
				</div>
				<div class="filters">
					<select id="filterSelect" aria-label="Filtrar poemas">
						<option value="all">Todos</option>
						<option value="favorites">Favoritos</option>
					</select>
					<button id="randomBtn" class="btn" type="button">Poema al azar</button>
				</div>
			</section>

			<section id="tagFilters" class="tag-filters" aria-label="Filtrar por categoría"></section>

			<section id="poemList" class="grid" aria-live="polite" aria-busy="true"></section>
		</main>

		<template id="poemCardTpl">
			<article class="card">
				<div class="card-inner">
					<div class="card-face card-front">
						<div class="card-head">
							<h2 class="card-title"></h2>
							<button
								class="fav-toggle"
								type="button"
								title="Marcar como favorito"
								aria-label="Marcar como favorito"
								aria-pressed="false"
							>
								♡
							</button>
						</div>
						<p class="card-meta"></p>
						<div class="card-actions">
							<button class="btn small" type="button" data-action="open">Leer</button>
							<button class="btn small ghost" type="button" data-action="copy">Copiar</button>
						</div>
					</div>
					<p class="card-face card-preview"></p>
				</div>
			</article>
		</template>

		<section class="update-info container">
			<p>Próxima publicación: cada sábado se publica nuevo contenido.</p>
		</section>

		<footer class="container footer">
			<a href="index.html">Literalia</a>
			<span>&copy; 2026</span>
			<a href="contacto.html">Contacto</a>
		</footer>

		<script src="app.js?v=20261014-analytics" type="module"></script>
	</body>
</html>
