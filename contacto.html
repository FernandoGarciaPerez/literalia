<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="images/pluma2.png" />
		<link rel="stylesheet" href="styles.css" />
		<meta name="color-scheme" content="light" />
		<title>Contacto — Literalia</title>
	</head>
	<body>
		<header class="app-header container">
			<a class="brand brand-link" href="index.html" aria-label="Ir al inicio de Literalia">
				<span class="logo" aria-hidden="true"></span>
				<div>
					<h1>Literalia</h1>
					<p class="tagline">Contacto</p>
				</div>
			</a>
			<nav class="site-nav" aria-label="Navegación principal">
				<a href="index.html">Inicio</a>
				<a href="contacto.html" aria-current="page">Contacto</a>
			</nav>
		</header>

		<main class="container narrow">
			<section class="card contact-card">
				<h2 class="section-title">Contacto</h2>
				<p class="descripcion">Envíanos un comentario o un poema para posible publicación.</p>

				<form id="contactForm" class="formulario" method="post" data-endpoint="">
					<div class="field">
						<label for="tipo">Tipo de envío</label>
						<select id="tipo" name="tipo" required>
							<option value="" disabled selected>Seleccionar</option>
							<option value="comentario">Comentario</option>
							<option value="poema">Poema para publicación</option>
						</select>
					</div>

					<div class="field">
						<label for="autor">Nombre o seudónimo</label>
						<input id="autor" type="text" name="autor" autocomplete="name" />
					</div>

					<div class="field">
						<label for="email">Correo electrónico</label>
						<input id="email" type="email" name="email" autocomplete="email" required />
					</div>

					<div class="field">
						<label for="titulo">Título <span class="muted">(solo para poemas)</span></label>
						<input id="titulo" type="text" name="titulo" />
					</div>

					<div class="field">
						<label for="mensaje">Contenido</label>
						<textarea id="mensaje" name="mensaje" required></textarea>
					</div>

					<label class="checkbox">
						<input type="checkbox" name="acepta_revision" required />
						Acepto que los poemas no se publican automáticamente.
					</label>

					<div class="acciones">
						<button type="submit" class="btn primary">Enviar</button>
						<span id="contactStatus" class="status" role="status" aria-live="polite"></span>
					</div>
				</form>
			</section>
		</main>

		<footer class="container footer">
			<a href="index.html">Literalia</a>
			<span>&copy; 2026</span>
			<a href="contacto.html">Contacto</a>
		</footer>

		<script src="contacto.js?v=20261014-analytics" type="module"></script>
	</body>
</html>
